    --gold-glow: #f0c06080;
    --cyan: #00e5ff;
    --cyan-glow: #00e5ff40;
    --purple: #b388ff;
    --purple-glow: #b388ff40;
    --text: #ccccdd;

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

    position: fixed; top: 0; left: 0; width: 100%; height: 100%;

    background:

      radial-gradient(1px 1px at 85% 15%, rgba(179,136,255,0.3), transparent),
      radial-gradient(1px 1px at 60% 60%, rgba(255,255,255,0.2), transparent),
      radial-gradient(1.5px 1.5px at 25% 35%, rgba(255,255,255,0.3), transparent),
      radial-gradient(1px 1px at 45% 90%, rgba(240,192,96,0.2), transparent);
  }

  .container { max-width: 1400px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 1; }

  .header { text-align: center; margin-bottom: 60px; }
  .header-badge {
    display: inline-block;
    background: linear-gradient(135deg, #f0c060, #e8a830);
    color: #1a1a0a; font-size: 0.85rem; font-weight: 700;
    letter-spacing: 0.15em; padding: 6px 20px; border-radius: 20px;
    margin-bottom: 16px; text-transform: uppercase;
    box-shadow: 0 0 30px rgba(240,192,96,0.5);
  }
  .header h1 {
    font-size: 3.2rem; font-weight: 900; letter-spacing: 0.05em;
    background: linear-gradient(180deg, #fff 20%, #f0c060 80%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; margin-bottom: 8px;
  }
  .header .subtitle { color: #666688; font-size: 1.1rem; letter-spacing: 0.1em; }

  .profile-card {
    display: flex; align-items: center; gap: 20px;
    background: #14141f; border: 1px solid #222244;
    border-radius: 16px; padding: 24px 32px; margin-bottom: 40px;
    box-shadow: 0 4px 30px rgba(0,0,0,0.3);
  }
  .profile-avatar {
    width: 80px; height: 80px; border-radius: 50%;
    border: 3px solid #f0c060; box-shadow: 0 0 20px rgba(240,192,96,0.5); flex-shrink: 0;
  }
  .profile-info h3 { font-size: 1.5rem; color: #fff; margin-bottom: 4px; }
  .profile-info .steam-id { color: #666688; font-size: 0.85rem; }
  .stats-row { display: flex; gap: 16px; margin-top: 12px; flex-wrap: wrap; }
  .stat-badge {
    background: rgba(255,255,255,0.05); border: 1px solid #222244;
    border-radius: 12px; padding: 8px 16px; font-size: 0.85rem;
  }
  .stat-badge .stat-num { font-size: 1.3rem; font-weight: 700; color: #fff; }
  .stat-badge .stat-label { color: #666688; font-size: 0.75rem; }

  .section { margin-bottom: 50px; }
  .section-header {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 24px; padding-bottom: 12px; border-bottom: 2px solid #222244;
  }
  .section-header .icon { font-size: 1.8rem; }
  .section-header h2 { font-size: 1.6rem; font-weight: 700; letter-spacing: 0.05em; }
  .section-header .count { color: #666688; font-size: 0.9rem; margin-left: auto; }
  .section-completed h2 { color: #f0c060; }
  .section-playing h2 { color: #00e5ff; }
  .section-backlog h2 { color: #b388ff; }

  .game-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }
  .game-card {
    background: #14141f; border: 1px solid #222244;
    border-radius: 12px; overflow: hidden;
    transition: all 0.3s ease; cursor: pointer; position: relative;
  }
  .game-card:hover {
    transform: translateY(-4px); border-color: #f0c060;
    box-shadow: 0 8px 30px rgba(240,192,96,0.25); background: #1a1a2e;
  }
  .game-card[data-category="playing"]:hover {
    border-color: #00e5ff; box-shadow: 0 8px 30px rgba(0,229,255,0.25);
  }
  .game-card[data-category="backlog"]:hover {
    border-color: #b388ff; box-shadow: 0 8px 30px rgba(179,136,255,0.25);
  }
  .game-card .card-img { width: 100%; height: 130px; object-fit: cover; background: #1a1a2e; }
  .game-card .card-img-placeholder {
    width: 100%; height: 130px;
    background: linear-gradient(135deg, #1a1a2e 0%, #222244 100%);
    display: flex; align-items: center; justify-content: center;
    font-size: 2.5rem; color: #333355;
  }
  .game-card .card-body { padding: 14px 16px; }
  .game-card .card-title {
    font-size: 0.95rem; font-weight: 600; color: #fff;
    margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .game-card .card-meta {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 0.8rem; color: #666688;
  }
  .card-completed .playtime { color: #f0c060; }
  .card-playing .playtime { color: #00e5ff; }
  .card-backlog .playtime { color: #b388ff; }

  .badge { font-size: 0.7rem; padding: 3px 10px; border-radius: 10px; font-weight: 600; letter-spacing: 0.05em; }
  .badge-completed { background: rgba(240,192,96,0.15); color: #f0c060; border: 1px solid rgba(240,192,96,0.3); }
  .badge-playing { background: rgba(0,229,255,0.15); color: #00e5ff; border: 1px solid rgba(0,229,255,0.3); animation: pulse-badge 2s infinite; }
  .badge-backlog { background: rgba(179,136,255,0.15); color: #b388ff; border: 1px solid rgba(179,136,255,0.3); }
  @keyframes pulse-badge { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

  .filter-bar { display: flex; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; }
  .filter-btn {
    background: #14141f; border: 1px solid #222244; color: #666688;
    padding: 8px 18px; border-radius: 20px; font-size: 0.85rem;
    cursor: pointer; transition: all 0.2s; font-family: inherit;

  .filter-btn:hover { color: #fff; border-color: #444; }
  .filter-btn.active {
    color: #fff; border-color: #f0c060;
    background: rgba(255,255,255,0.05); box-shadow: 0 0 12px rgba(240,192,96,0.3);
  }

  /* Modal */
  .modal-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.85); backdrop-filter: blur(12px);
    z-index: 1000; display: flex; align-items: center; justify-content: center;
    opacity: 0; visibility: hidden; transition: all 0.3s ease; padding: 20px;
  }
  .modal-overlay.open { opacity: 1; visibility: visible; }
  .modal-box {
    background: linear-gradient(160deg, #14141f 0%, #0d0d1a 100%);
    border: 1px solid #222244; border-radius: 20px;
    max-width: 600px; width: 100%; max-height: 90vh; overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 40px rgba(240,192,96,0.08);

  .modal-close {

    .game-card .card-title { font-size: 0.8rem; }
    .profile-card { flex-direction: column; text-align: center; }

function formatPlaytime(minutes) {
  if (minutes < 60) return minutes + ' 分钟';
  const h = Math.floor(minutes / 60);
  if (h < 10) return h + '.' + Math.round((minutes % 60) / 6) + ' 小时';
  return h + ' 小时';
}

function getBadge(cat) {
  if (cat === 'completed') return '<span class="badge badge-completed">已通关</span>';
  if (cat === 'playing') return '<span class="badge badge-playing">进行中</span>';
  return '<span class="badge badge-backlog">待攻略</span>';
}

function getCardClass(cat) {
  if (cat === 'completed') return 'card-completed';
  if (cat === 'playing') return 'card-playing';
  return 'card-backlog';
}

function createCard(g) {
  const imgUrl = `https://cdn.cloudflare.steamstatic.com/steam/apps/${g.appid}/capsule_231x87.jpg`;
  return `<div class="game-card ${getCardClass(g.category)}" data-category="${g.category}" data-id="${g.appid}" onclick="openModal(${g.appid})">
    <img class="card-img" src="${imgUrl}" alt="${g.name}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
    <div class="card-img-placeholder" style="display:none">🎮</div>
    <div class="card-body">
      <div class="card-title" title="${g.name}">${g.name}</div>
      <div class="card-meta">
        <span class="playtime">${formatPlaytime(g.playtime)}</span>
        ${getBadge(g.category)}
      </div>
    </div>
  </div>`;
}

const gameMap = {};
games.forEach(g => gameMap[g.appid] = g);

function timeAgo(ts) {
  if (!ts) return '从未';
  const diff = Math.floor((NOW - ts) / DAY);
  if (diff < 1) return '今天';
  if (diff < 7) return diff + ' 天前';
  if (diff < 30) return Math.floor(diff / 7) + ' 周前';
  if (diff < 365) return Math.floor(diff / 30) + ' 个月前';
  return Math.floor(diff / 365) + ' 年前';
}

function openModal(appid) {
  const g = gameMap[appid];
  if (!g) return;
  const overlay = document.getElementById('modal');
  const box = document.getElementById('modal-box');
  document.getElementById('modal-hero').src = `https://cdn.cloudflare.steamstatic.com/steam/apps/${appid}/library_hero.jpg`;
  document.getElementById('modal-hero').onerror = function() { this.src = `https://cdn.cloudflare.steamstatic.com/steam/apps/${appid}/header.jpg`; };
  document.getElementById('modal-title').textContent = g.name;
  document.getElementById('modal-sub').textContent = 'App ID: ' + appid;
  document.getElementById('modal-playtime').textContent = formatPlaytime(g.playtime);
  document.getElementById('modal-playtime').className = 'val ' + g.category;
  document.getElementById('modal-lastplayed').textContent = timeAgo(g.lastPlayed);
  document.getElementById('modal-steam-link').href = 'https://store.steampowered.com/app/' + appid;
  const catNames = {completed:'已通关', playing:'进行中', backlog:'待攻略'};
  document.getElementById('modal-category').textContent = catNames[g.category] || g.category;
  document.getElementById('modal-category').className = 'val ' + g.category;
  box.className = 'modal-box ' + g.category;
  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
  document.body.style.overflow = '';
}

function renderAll() {
  const cats = {completed: [], playing: [], backlog: []};
  games.forEach(g => cats[g.category].push(g));
  document.getElementById('grid-completed').innerHTML = cats.completed.map(createCard).join('');
  document.getElementById('grid-playing').innerHTML = cats.playing.map(createCard).join('');
  document.getElementById('grid-backlog').innerHTML = cats.backlog.map(createCard).join('');
  document.getElementById('count-completed').textContent = cats.completed.length + ' 款';
  document.getElementById('count-playing').textContent = cats.playing.length + ' 款';
  document.getElementById('count-backlog').textContent = cats.backlog.length + ' 款';
  document.getElementById('stat-completed').textContent = cats.completed.length;
  document.getElementById('stat-playing').textContent = cats.playing.length;
  document.getElementById('stat-hours').textContent = Math.round(games.reduce((s,g) => s + g.playtime, 0) / 60);
}

function filterGames(cat, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.section').forEach(s => s.style.display = 'block');
  document.querySelectorAll('.game-card').forEach(c => { c.style.display = cat === 'all' ? '' : (c.dataset.category === cat ? '' : 'none'); });
  if (cat === 'completed') document.getElementById('section-completed').scrollIntoView({behavior:'smooth'});
  if (cat === 'playing') document.getElementById('section-playing').scrollIntoView({behavior:'smooth'});
  if (cat === 'backlog') document.getElementById('section-backlog').scrollIntoView({behavior:'smooth'});
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
renderAll();
</script>
</body>
</html>
